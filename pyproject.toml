[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfmtrace"
version = "0.1.0"
description = "Parse, format, and analyze Python tracebacks from the terminal."
readme = "README.md"
license = { text = "MIT" }
urls = { Repository = "https://github.com/noahalexandercampbell/pyfmtrace" }
requires-python = ">=3.11"
authors = [{ name = "ProjectCreationAgent" }]
keywords = ["traceback", "debugging", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pyfmtrace = "pyfmtrace.cli:main"

[tool.setuptools]
packages = ["pyfmtrace"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
pyfmtrace = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
